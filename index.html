# Золотая лихорадка — документация по модам (API v1)

Эту страницу можно целиком отправить нейросети: «Вот API игры. Напиши мод, который …». Ответ нейросети — один JS-файл (или набор файлов для ZIP), который ставится на вкладке «Моды».

## 1. Что такое мод

Мод — обычный JavaScript-код (тело функции). Ему доступна одна переменная: `GoldRush` (API мода). Код выполняется один раз при запуске игры (и сразу после установки). Всё, что мод хочет добавить, он регистрирует вызовами `GoldRush.addXxx(...)`, а реакции на игру вешает через `GoldRush.on(событие, функция)`.

Моды хранятся в LocalStorage браузера. Включение, выключение, удаление и правка кода перезапускают игру (прогресс сохраняется).

### Форматы установки

Вкладка «Моды» принимает мод любым из способов: вставить код в поле; вставить в то же поле ссылку (`https://…/mod.js` или `…/mod.zip`); кнопка «По ссылке…»; кнопка «Файл…» (можно выбрать несколько `.js` и `.zip` сразу). Ссылка должна отдавать файл с разрешением CORS (например, GitHub raw).

1. **Один файл `.js`** — всё в одном файле, метаданные в комментариях `// @id …` (см. ниже).
2. **ZIP-архив** — для модов из нескольких файлов:
```
my_mod.zip
├─ mod.json          (необязателен) метаданные
├─ main.js           главный файл (или имя из поля "main")
├─ lib/util.js       любые модули
├─ data/items.json   данные
└─ img/ruby.png      картинки
```
`mod.json`: `{ "id": "my_mod", "name": "Мой мод", "version": "1.0", "author": "Я", "description": "…", "main": "main.js" }`. Если `mod.json` нет, главным считается `main.js` (или `index.js`, или единственный `.js`), а метаданные берутся из комментариев `// @…` в нём. Архив можно упаковать как со сжатием, так и без (Store). Пароль и ZIP64 не поддерживаются; лимит — 300 файлов, 8 МБ после распаковки; всё хранится в LocalStorage (около 5 МБ на сайт), поэтому картинки лучше делать маленькими.

В ZIP-моде доступны:
- `require('./lib/util.js')` — подключение своих модулей (CommonJS: внутри модуля `module.exports = …`; пути относительные; расширение `.js` можно опустить; `require('./data.json')` возвращает объект);
- `GoldRush.asset('img/ruby.png')` — картинка как data-URI (подходит для `icon: { texture: GoldRush.asset('img/ruby.png') }`, лучше 16×16 или 32×32 px);
- `GoldRush.text('path')`, `GoldRush.json('path')` — содержимое текстового файла / разобранный JSON;
- `GoldRush.files()` — список файлов архива.

Одинаковый `id` при повторной установке заменяет мод (обновление).

### Заголовок мода (необязателен, но рекомендуется)

Первые строки файла — комментарии в стиле userscript:

```js
// @id my_mod            // латиница/цифры/_, уникальный; повторная установка с тем же id заменяет мод
// @name Мой мод
// @version 1.0
// @author Имя
// @description Короткое описание
```

### Правила для автора мода (важно для нейросети)

1. Только чистый JS, без `import` и внешних библиотек. `require` можно использовать только для своих файлов внутри ZIP; одиночный `.js` самодостаточный.
2. Не обращаться к внутренностям игры (кроме `GoldRush.state` для чтения). Менять ресурсы только через `GoldRush.res.add/spend`.
3. НЕ менять `GoldRush.state.coins` и `GoldRush.state.gems` напрямую: встроенный античит расценит это как взлом и конфискует монеты. Монеты выдавать только через `GoldRush.res.add('coins', n)`.
4. Все id (предметов, блоков, рецептов, узлов) — латиница, цифры, `_`, 2–32 символа, начинаются с буквы. Используйте префикс мода: `ruby_gem`, `ruby_ore`.
5. Порядок: сначала `addItem`, потом `addBlock`/`addRecipe`/`addTreeNode`, которые на них ссылаются.
6. Ошибки внутри обработчиков не ломают игру: они пишутся в «Журнал ошибок» на вкладке «Моды».
7. Не делать тяжёлую работу в событиях `tick` (вызывается каждый кадр) — только лёгкие проверки.
8. Тексты для игрока — по-русски, коротко.

## 2. Быстрый пример

```js
// @id ruby
// @name Рубины
// @version 1.0
// @description Новая руда: рубин. Продаётся на рынке и крафтится в слиток.
const gr = GoldRush;

gr.addItem({ id: 'ruby_gem', name: 'Рубин', icon: { gem: '#e0115f' }, price: 90 });
gr.addItem({ id: 'ruby_bar', name: 'Рубиновый слиток', icon: { ingot: '#e0115f' }, price: 420 });

gr.addBlock({

## 3. Справочник API (`GoldRush`)

### Состояние и ресурсы
| Вызов | Описание |
|---|---|
| `GoldRush.state` | Живой объект состояния игры. **Только чтение.** Полезные поля: `coins, ore, coal, ingot, diamond, gems, level, xp, stars, loc, stats{blocks,rounds,...}`. |
| `GoldRush.res.get(id)` | Сколько ресурса (`'coins'`, `'ore'`, `'ingot'`, любой предмет мода). |
| `GoldRush.res.add(id, n)` | Добавить (n<0 — отнять). Единственный честный способ выдать монеты. |
| `GoldRush.res.spend(id, n)` | Списать, если хватает. Возвращает `true/false`. |
| `GoldRush.res.has(id, n)` | Хватает ли. |
| `GoldRush.res.list()` | Все известные id ресурсов. |
| `GoldRush.level`, `.loc`, `.stars`, `.gems` | Быстрые геттеры (уровень, id локации, перекрут-монеты, изумруды). |
| `GoldRush.locations()` | `[{id,name,unlocked,done,progress,goal}]`. Локации: `forest, ice, desert, deep, sea, nether, end`. |
| `GoldRush.price(id)` | Текущая рыночная цена предмета или `null`. |
| `GoldRush.addXP(n)` | Выдать опыт. |

Основные ресурсы игры: `coins, ore (золотая руда), coal, ingot (золотой слиток), gblock, diamond, iron, ironIng, redstone, emerald (нефрит), gear, circuit, apple, eApple, pHaste, pLuck, pTime, wood, pumpkin, ice, sand, cactus, lapis, prism, sponge, quartz, glow, obs, chorus`. Изумруды (`gems`) — премиум-валюта, их нельзя добавлять модами.

### Регистрация контента

**`addItem({id, name, icon, price?, loc?, reserve?, inventory?})`** — предмет (ресурс).
`price` — если задан, предмет появится на рынке с этой базовой ценой. `loc` — id локации, после открытия которой товар виден на рынке. `inventory:false` — не показывать на складе.

**`addBlock({id, name, desc?, icon, hp, life, xp?, minLevel?, weights, drops?, coins?, hazard?, particles?, onSpawn?, onHit?, onBreak?, onExpire?})`** — новый блок, появляющийся на поле.
- `hp` — прочность (в ударах), `life` — сколько секунд блок живёт.
- `weights` — число (шанс везде) или объект `{ '*': 3, ice: 8 }` (по локациям; `'*'` — остальные). Для сравнения: золото ≈ 40, уголь ≈ 15, алмаз ≈ 2.
- `drops` — `{ предмет: [мин, макс, шанс?] }`, `coins` — `[мин, макс]` монет за блок.
- `hazard:true` — опасный блок: помощники и автодобытчик его не трогают, динамит его обезвреживает.
- Колбэки получают объект-контекст `c`: `{ block, type, x, y, player }`. В `onBreak` можно поставить `c.cancel = true`, чтобы отменить стандартную награду.
- Сам блок: `block.hp`, `block.life` (секунды до исчезновения), `block.type`.

**`addRecipe({id, group?, name?, icon?, cost, out, amount?, desc?, once?})`** — рецепт на верстаке (вкладка «Печь»). `cost` — `{ предмет: число }` (монеты в рецептах нельзя). `group` — заголовок секции (по умолчанию «Моды»). `once:true` — можно создать только один раз.

**`addTreeNode({id, name, desc?, icon?, branch?, req?, cost?, bonus?})`** — узел древа навыков. `req` — id узлов-предпосылок. `cost` — `{coins:…, предмет:…}`. `bonus` — `{ ключ: число }` (см. «Бонусы»).

**`addUpgrade({id, name, desc?, icon?, max, cost(level), effect?(level), onBuy?(level), persist?})`** — многоуровневое улучшение в «Лавке». `cost(level)` возвращает `{coins:…}` для покупки следующего уровня (level — текущий, с 0). `effect(level)` возвращает `{ключ: число}` бонусов для текущего уровня. `persist:true` — улучшение сохраняется при перекрутке. Текущий уровень: `GoldRush.level_of(id)`.

**`addTab({id, title, icon?, render(el)})`** — новая вкладка нижнего меню. `title` до 10 символов. `render(el)` вызывается при каждом открытии вкладки: наполните `el` (DOM-элемент). Поддерживаются `GoldRush.h` и `GoldRush.ui`.

**`addPanel(slot, {title?, render(el)})`** — карточка внутри существующей вкладки. Слоты: `mine` (под полем), `furnace`, `market`, `shop`, `tree`, `prog` («Ещё»). `render` вызывается при каждой перерисовке вкладки.

**`addBonus(key, число | функция)`** — постоянный бонус. Функция вычисляется при пересчёте бонусов (`GoldRush.refreshBonuses()` пересчитывает вручную).

Ключи бонусов (складываются с бонусами древа): `dmg` (+урон), `ore` (+доля добычи руды, 0.15 = +15%), `coin` (+доля монет), `time` (+секунды раунда), `spawn` (+интенсивность появления блоков), `combo` (+длительность комбо, с), `clock` (+секунды за часы), `sell` (+доля к цене продажи), `spread` (−доля разницы покупки/продажи), `smelt` (−секунды плавки), `slots` (+печи), `cd` (−доля перезарядки умений), `pen` (−секунды штрафа TNT), `autoEff` (+эффективность автодобытчика), `green` (1 — зелёный TNT безвреден), `shield` (1 — красный TNT отнимает половину времени вместо конца), `defuse` (1 — фиолетовый TNT штрафует вдвое меньше). Можно придумывать свои ключи и читать их через `GoldRush.bonus('ключ')`.

**Иконки** (`icon` в addItem/addBlock/addTreeNode/…): одна из форм
- `'#rrggbb'` — значок по умолчанию (самоцвет для предмета, блок для блока);
- `{ gem|ore|block|nugget|ingot|potion|apple: '#rrggbb' }` — готовые генераторы;
- `{ rows: [...16 строк по 16 символов], palette: { 'a': '#ff0000', ... } }` — пиксель-арт (`.` — прозрачно);
- `{ texture: 'data:image/png;base64,...' }` или `'https://…'` — своя картинка;
- строка с существующим ключом значка, например `'coin'`, `'gear'`, `'pick3'`, `'b_gold'`, `'diamond'`, `'ingot'`.

### События — `GoldRush.on(имя, функция)` (возвращает функцию отписки)
| Событие | Аргумент |
|---|---|
| `ready` | — (после загрузки всех модов) |
| `second` | — (раз в секунду, всегда) |
| `tick` | `dt` секунд (каждый кадр, **только во время раунда**) |
| `roundStart` | объект раунда |
| `roundEnd` | итоги `{coins, ore, coal, diamond, blocks, xp, extra}` |
| `blockSpawn` | блок |
| `blockHit` | `{block, type, damage, player}` |
| `blockBreak` | `{block, type, x, y, player}` |
| `blockExpire` | `{block, type, x, y}` (блок исчез сам) |
| `drop` | `{type, drop, coins, xp}` — **можно менять** `drop`, `coins`, `xp` до выдачи награды |
| `travel` | `(новаяЛокация, старая)` |
| `tab` | id открытой вкладки |
| `levelUp` | новый уровень |
| `craft` | `(idРецепта, количество)` |

### Раунд — `GoldRush.round`
`active` (идёт ли раунд), `timeLeft`, `combo`, `blocks` (живые блоки), `addTime(сек)`, `spawn(тип?)` (создать блок; без типа — случайный; вернёт `true/false`), `hit(блок, урон?)`, `start()`, `end()`, `blockTypes()`.

### Интерфейс и прочее
- `GoldRush.toast(текст, ключЗначка?)`, `GoldRush.sfx('coin'|'buy'|'err'|'level'|'boom'|'brk'|'start'|'end')`, `GoldRush.fmt(число)` (1.2K, 3.4M), `GoldRush.icon(ключ)` → HTML `<img>`, `GoldRush.css(текст)` — добавить CSS, `GoldRush.refresh()` — перерисовать текущую вкладку.
- Хранение: `GoldRush.storage.get(ключ, поУмолчанию)`, `.set(ключ, значение)`, `.remove(ключ)` — постоянное хранилище мода в LocalStorage (JSON). `GoldRush.data` — объект, который хранится **внутри сохранения игры** (попадает в экспорт, переживает перекрутку; мутируйте его свойства).
- `GoldRush.save()` — принудительно сохранить игру.

### Библиотека — `GoldRush.lib`
- Утилиты: `rnd(a,b)`, `ri(a,b)` (целое), `clamp(v,a,b)`, `pick(массив)`, `chance(p)`, `weighted([[значение, вес], …])`, `fmt(n)`, `shade('#hex', множитель)`, `rng(seed)`.
- `GoldRush.h(тег, свойства, ...дети)` — сборка DOM. Свойства: `class, style (строка или объект), text, html, dataset, onClick, onInput, …, прочие атрибуты`. Обработчики событий защищены от ошибок.
- `GoldRush.ui` — готовые элементы в стиле игры: `card(заголовок, ...дети)`, `row({icon, title, sub, right})`, `button(текст, onClick, {cls:'gold'|'blue'|'red'|'em', disabled, icon})`, `btnrow(...кнопки)`, `bar(доля)` (у результата есть `.set(доля)`), `tag(текст)`, `small(текст)`, `icon(ключ)`, `costs({coins:100, ruby_gem:2})`.
- `GoldRush.lib.tex` — генераторы картинок (возвращают data-URI): `pixels(rows, palette)`, `block(seed,{b:[цвета],sp:[цвета],n})`, `ore(seed,[4 цвета])`, `gem(светлый,средний,тёмный)`, `nugget(seed,[3 цвета])`, `ingot(палитра)`, `potion(цвет1,цвет2)`, `solid(цвет)`.

## 4. Примеры

### Вкладка со счётчиком и улучшением
```js
// @id counter
// @name Счётчик
const gr = GoldRush, { h, ui } = gr;
let breaks = gr.storage.get('breaks', 0);
gr.on('blockBreak', c => { if (c.player) { breaks++; gr.storage.set('breaks', breaks); } });
gr.addTab({ id: 'counter', title: 'Счёт', icon: 'star', render(el) {
  el.appendChild(ui.card('Мои удары',
    h('div', {}, 'Сломано игроком: ' + breaks),
    ui.button('Подарок 500 монет', () => { gr.res.add('coins', 500); gr.refresh(); }, { cls: 'gold' })));
}});
gr.addUpgrade({ id: 'power', name: 'Тренировка', desc: '+1 к урону за уровень', max: 5,
  cost: l => ({ coins: 1500 * Math.pow(2, l) }), effect: l => ({ dmg: l }) });
```

### Бонус времени за фиолетовую бомбу и свой «часовой» блок
```js
// @id timeblock
// @name Песочные часы
const gr = GoldRush;
gr.addBlock({ id: 'sand_clock', name: 'Песочные часы', desc: '+5 секунд', icon: { block: '#e8c35a' },
  hp: 2, life: 2.2, weights: { '*': 3 },
  onBreak(c) { gr.round.addTime(5); gr.toast('+5 с', 'clock'); c.cancel = true; } });
```

### Бонус к награде через событие drop
```js
// @id luckycoins
// @name Удачливые монеты
GoldRush.on('drop', d => { if (Math.random() < 0.05) d.coins *= 3; });
```

## 5. Безопасность и сбои
- Мод имеет полный доступ к странице: ставьте только проверенный код.
- Если мод завис при запуске, он автоматически отключается при следующем открытии игры. Если игра не открывается вообще, добавьте к адресу `#nomods` — моды не запустятся.
- Античит игры сравнивает монеты и изумруды с учётом начислений. Мод, который пишет в `state.coins` напрямую, будет наказан обнулением. Используйте `res.add`.

  if((x+y===15||x+y===14)&&x>=2&&x<=10&&y<=13)return x+y===15?'#a8793c':'#6e4a22';return null})}
const gemTex=(L,M,D)=>gen((x,y)=>{const dx=Math.abs(x-7.5),dy=Math.abs(y-7.5),s=dx+dy;if(s>7)return null;if(s>6)return D;if(y<5.5&&dx<3)return L;if(s>5)return D;return x<7.5?(y<7.5?L:M):(y<7.5?M:D)});
function coinTex(){return gen((x,y)=>{const d=Math.hypot(x-7.5,y-7.5);if(d>6.2)return null;if(d>5.2)return '#9a6a05';if(d>4.2)return '#e0a81c';
  if((x===7||x===8)&&y>=4&&y<=11)return '#b07a0c';if(x+y<11&&d>2)return '#fff27a';return '#f9d03f'})}
function nuggetTex(seed,p){const r=rng(seed);return gen((x,y)=>{const d=Math.hypot(x-7.5,y-8.2),n=r()*1.1;if(d>4.6+n*.6)return null;if(d>3.6)return p[0];return x+y<14?p[1]:p[2]})}
function lumpTex(){const r=rng(8);return gen((x,y)=>{const d=Math.hypot(x-7.5,y-8),n=r()*1.2;if(d>5.2+n*.5)return null;if(d>4.3)return '#0c0c0c';return(x+y<12&&r()<.5)?'#555':(r()<.2?'#3a3a3a':'#202020')})}
function dustTex(){const r=rng(13);return gen((x,y)=>{const d=Math.hypot(x-7.5,y-8.5),n=r();if(d>5+n*.8)return null;if(d>4)return '#8a1010';return(x+y<12&&r()<.5)?'#ff6a5a':(r()<.25?'#ff3a2a':'#d41f1f')})}

function ingotTex(p){return gen((x,y)=>{
  if(y>=5&&y<=7){const x0=3+(7-y),x1=11+(7-y);if(x>=x0&&x<=x1)return(y===5||x===x0||x===x1)?p.tl:p.tm}
  if(y>=8&&y<=11&&x>=3&&x<=11)return y===11?p.fb:(x===3?p.fl:p.f);
  if(y>=6&&y<=10&&x>=12&&x<=13)return(x-12)+(y-6)<=4&&y-6>=x-12?p.s:null;
  if(y===12&&x>=3&&x<=11)return p.sh;return null})}
function appleTex(c){return gen((x,y)=>{const d=Math.hypot(x-7.5,y-9);if(y>=2&&y<=3&&x>=8&&x<=10)return '#3fa535';if(x===7&&y>=3&&y<=4)return '#6e4a22';
  if(d>5.6)return null;if(d>4.6)return c[1];if(x>=4&&x<=6&&y>=6&&y<=7)return c[2];return c[0]})}
function gearTex(){return gen((x,y)=>{const dx=Math.abs(x-7.5),dy=Math.abs(y-7.5),d=Math.hypot(dx,dy);if(d<=2.4)return null;
  if(d>7.8)return null;if(d>6){return(dx<1.7||dy<1.7||Math.abs(dx-dy)<1.2)?'#d0d0d0':null}
  if(d>5)return '#7a7a7a';return x+y<12?'#b5b5b5':'#8d8d8d'})}
function circuitTex(){return gen((x,y)=>{if(x===0||y===0||x===15||y===15)return '#1c5f28';

function clockTex(){return gen((x,y)=>{const d=Math.hypot(x-7.5,y-7.5);if(d>6.6)return null;if(d>5.6)return '#b07a0c';

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.05,slide=0,delay=0){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fc){if(!S.sound)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

function weights(){const L=curLoc(),lk=luckEff(),w=[];
  const add=(t,x,min)=>{if(x>0&&S.level>=(min||1))w.push([t,x])};
  add('gold',L.w.gold);add('coal',L.w.coal);add('iron',L.w.iron);add('redstone',L.w.redstone);
  add('diamond',L.w.diamond?L.w.diamond+.4*lk:0);add('emerald',L.w.emerald?L.w.emerald+.15*lk:0);add('chest',L.w.chest?L.w.chest+.3*lk:0,2);
  add('clock',L.w.clock);add('tnt',L.w.tnt);add('gTnt',L.w.gTnt,2);add('pTnt',L.w.pTnt,3);add('rTnt',L.w.rTnt,3);

/* ================= ДОБЫЧА: расчёт наград ================= */
function calcDrop(t,x){const rd=a=>Math.max(1,Math.round(a)),drop={},lk=x.lk,fv=x.fv,cm=x.cm,lv=x.lv,mo=mulOre(),mc=mulCoin();let coins=0;const xp=(BT[t]||{}).xp||0;
  if(t==='gold'){drop.ore=rd((1+Math.random()*(1+lk*.6))*lv*fv*cm*mo);coins=rd(rnd(2,5)*lv*fv*cm*mc)}
  else if(t==='coal'){drop.coal=rd((1+Math.random()*(1.5+lk*.4))*fv);coins=rd(mc)}
  else if(t==='iron'){drop.iron=rd((1+Math.random()*(1+lk*.4))*fv*(1+S.stars*.1)*mo);coins=rd(2*mc)}
  else if(t==='redstone'){drop.redstone=rd((2+Math.random()*(2+lk*.4))*fv);coins=rd(2*mc)}
  else if(t==='diamond'){drop.diamond=1+(Math.random()<.1*lk?1:0);coins=Math.round(10*fv*cm*mc)}
  else if(t==='emerald'){drop.emerald=1+(Math.random()<.08*lk?1:0);coins=Math.round(25*fv*cm*mc)}
  else if(t==='chest'){coins=rd(rnd(40,110)*lv*fv*mc);drop.ingot=ri(1,2+Math.floor(lk/2));drop.iron=ri(1,3);drop.redstone=ri(1,4);
    if(Math.random()<.2+.03*lk)drop.emerald=1;if(Math.random()<.15)drop.apple=1;if(S.level>=4&&Math.random()<.18)drop.gear=1;if(Math.random()<.03+.01*lk)drop.diamond=1}
  else if(NB[t]){const nb=NB[t];if(nb.res)drop[nb.res]=rd(rnd(nb.amt[0],nb.amt[1]+.99)*fv*mo*(1+lk*.04));coins=rd(rnd(nb.coins[0],nb.coins[1]+.99)*lv*fv*cm*mc)}
  return{drop,coins,xp}}
function applyDrop(drop,coins){for(const k in drop)S[k]+=drop[k];addCoins(coins);S.stats.blocks++;if(drop.diamond)S.stats.diaGot+=drop.diamond;if(drop.chest)S.stats.chests++;locCount()}

function spawnBlock(){if(!R)return;const F=$('blocks'),W=F.clientWidth,H=F.clientHeight;if(W<80)return;const size=W<420?58:70;let x,y,ok=false;
  for(let i=0;i<14&&!ok;i++){x=rnd(6,W-size-6);y=rnd(6,H-size-14);ok=R.blocks.every(b=>Math.hypot(b.x-x,b.y-y)>size*.95)}if(!ok)return;
  const type=pickType(),d=BT[type],el=document.createElement('div');el.className='blk '+type;el.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
  el.innerHTML=`<div class="bimg bt-b_${type}"></div><div class="crack"></div><div class="lt"><i></i></div>`;F.appendChild(el);
  const b={type,hp:d.hp,max:d.hp,el,crack:el.querySelector('.crack'),bar:el.querySelector('.lt i'),life:d.life*rnd(.9,1.1),x,y,size,dead:false,lastF:1};b.lifeMax=b.life;el._b=b;R.blocks.push(b)}
function removeBlock(b,anim){b.dead=true;const i=R.blocks.indexOf(b);if(i>=0)R.blocks.splice(i,1);if(anim){b.el.classList.add('breaking');setTimeout(()=>b.el.remove(),200)}else b.el.remove()}
function hitBlock(b,d,o){o=o||{};if(!R||b.dead)return;if(b.type==='tnt'){explode(b);return}
  const cx=o.px!=null?o.px:b.x+b.size/2,cy=o.py!=null?o.py:b.y+b.size/2;b.hp-=d;particles(cx,cy,b.type,4,1);
  if(b.hp<=0){breakBlock(b,o);return}
  sfx.hit();const st=clamp(Math.ceil((1-b.hp/b.max)*3),1,3);b.crack.className='crack on bt-crack'+st;
  b.el.classList.remove('hit');void b.el.offsetWidth;b.el.classList.add('hit')}
function breakBlock(b,o){removeBlock(b,true);const player=!!o.player,t=b.type,cx=b.x+b.size/2,cy=b.y+b.size/2;
  if(player){R.combo++;R.comboT=1.6+tv('combo');R.maxCombo=Math.max(R.maxCombo,R.combo);S.stats.maxCombo=Math.max(S.stats.maxCombo,R.combo)}
  const cm=1+Math.min(R.combo,60)*.02;
  if(t==='gTnt'){const pen=tv('green')?0:2;if(pen){R.t-=pen;R.combo=0;R.comboT=0;sfx.err();floatText(cx,cy,[{t:'−'+pen+' с'}],'bad')}else floatText(cx,cy,[{t:'обезврежен',c:'#8fe35a'}]);particles(cx,cy,t,10,1);return}
  if(t==='rTnt'||t==='pTnt'){S.stats.defused++;const c=Math.round((t==='rTnt'?30:15)*bonusMul()*mulCoin());addCoins(c);floatText(cx,cy,[{t:'обезврежен!',c:'#8fe35a'},{i:'coin',t:'+'+c,c:'#ffd93b'}]);particles(cx,cy,t,12,1);sfx.brk();addXP(5);return}
  if(t==='clock'){const s=1+tv('clock');R.t+=s;R.total=Math.max(R.total,R.t);floatText(cx,cy,[{t:'+'+s+' с',c:'#7fd0ff'}]);particles(cx,cy,t,10,1);sfx.coin();addXP(2);return}
  const {drop,coins,xp}=calcDrop(t,{cm,fv:R.fever,lk:luckEff(),lv:bonusMul()});applyDrop(drop,coins);
  const g=R.got;g.coins+=coins;g.blocks++;g.xp+=xp;
  for(const k in drop){if(k==='ore'||k==='coal'||k==='diamond')g[k]+=drop[k];else g.extra[k]=(g.extra[k]||0)+drop[k]}
  const parts=Object.keys(drop).map(k=>({i:ITEM[k][1],t:'+'+drop[k]}));if(coins)parts.push({i:'coin',t:'+'+coins,c:'#ffd93b'});
  floatText(cx,cy,parts);particles(cx,cy,t,t==='chest'?22:14,1);
  if(t==='diamond'||t==='emerald'){sfx.coin();sfx.level()}else if(t==='chest'){sfx.coin();sfx.brk()}else sfx.brk();
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}

function explode(b){removeBlock(b,true);const cx=b.x+b.size/2,cy=b.y+b.size/2,pen=tntPen();R.t-=pen;R.combo=0;R.comboT=0;S.stats.tnt++;

  const W=$('blocks').clientWidth,H=$('blocks').clientHeight;

  R.spawnT-=dt;if(R.spawnT<=0){if(R.blocks.length<Math.min(12,4+effSpawn()))spawnBlock();R.spawnT=Math.max(.25,.85-.06*effSpawn())*rnd(.7,1.3)*(R.rageT>0?.5:1)}
  const fr=R.freezeT>0;
  R.blocks.slice().forEach(b=>{if(b.dead)return;if(!fr)b.life-=dt;const f=clamp(b.life/b.lifeMax,0,1);if(Math.abs(f-b.lastF)>.03){b.lastF=f;b.bar.style.transform='scaleX('+f+')'}if(b.life<=0)expireBlock(b)});
  if(R&&S.helpers>0){R.hAcc+=dt*S.helpers*.5;while(R.hAcc>=1&&R){R.hAcc-=1;helperHit()}}}

const AUTO={n:0,coins:0,items:{},last:0};
function autoRun(){const sp=Math.max(.25,.85-.06*effSpawn());const n=clamp(Math.floor(roundTime()/sp*autoEff()),1,60);
  for(let i=0;i<n;i++){const t=pickType();if(isHaz(t)||t==='clock')continue;const {drop,coins,xp}=calcDrop(t,{cm:1,fv:1,lk:S.luck,lv:bonusMul()});applyDrop(drop,coins);addXP(xp);
    AUTO.n++;AUTO.coins+=coins;for(const k in drop)AUTO.items[k]=(AUTO.items[k]||0)+drop[k]}}
function flushAuto(force){if(AUTO.n<=0)return;const now=Date.now();if(!force&&now-AUTO.last<20000)return;AUTO.last=now;
  const top=Object.keys(AUTO.items).slice(0,4).map(k=>'+'+fmt(AUTO.items[k])+' '+ITEM[k][0].toLowerCase()).join(', ');
  toast(`Автодобытчик: ${AUTO.n} блоков, +${fmt(AUTO.coins)} монет${top?', '+top:''}`,'villager3');AUTO.n=0;AUTO.coins=0;AUTO.items={}}
function merchTick(){const L=S.merch;if(L<1)return;let gain=0,spent=0;const vol=6+4*L,bonus=1+.03*(L-1);
  GOODS.forEach(g=>{if(!g.raw)return;if(g.loc&&!S.locUnl[g.loc])return;const p=price(g.id),ratio=p/g.base,own=S[g.id],res=g.res||20;
    if(ratio>=1.10&&own>res){const n=Math.min(own-res,vol);const c=Math.floor(n*sellP(g.id)*bonus);S[g.id]-=n;addCoins(c);gain+=c;S.stats.sold+=n}
    else if(ratio<=.82&&['ore','coal','iron','redstone'].includes(g.id)){const n=Math.min(Math.floor(vol*.7),Math.floor(S.coins*.05/buyP(g.id)));if(n>0){const c=n*buyP(g.id);S.coins-=c;S[g.id]+=n;spent+=c}}});
  S.merchProfit+=gain-spent;if(gain>=500)toast('Перекупщик: +'+fmt(gain)+' монет','villager2')}

function passive(dt){
  if(S.cart>0){S.cartAcc+=S.cart*.3*dt;const n=Math.floor(S.cartAcc);if(n>0){S.cartAcc-=n;S.ore+=n}}
  const sp=slotsN()/smeltTime();
  if(S.queue>0){S.prog+=dt*sp;while(S.prog>=1&&S.queue>0){S.prog-=1;S.queue--;S.ingot++;S.stats.ingots++}if(S.queue<=0){S.queue=0;S.prog=0}}else S.prog=0;
  if(S.qI>0){S.progI+=dt*sp;while(S.progI>=1&&S.qI>0){S.progI-=1;S.qI--;S.ironIng++}if(S.qI<=0){S.qI=0;S.progI=0}}else S.progI=0;
  if(S.autoM>0){S.autoT+=dt;let c=0;const cy=autoCycle();while(S.autoT>=cy&&c<100){S.autoT-=cy;autoRun();c++}if(c>=100)S.autoT=0}}

    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),wrap?wrap(v):v);

  const add=c=>{if(c==null||c===false)return;if(Array.isArray(c))c.forEach(add);else el.appendChild(c.nodeType?c:document.createTextNode(String(c)))};

      const key='m_'+d.id;if(MODTABS[key]&&MODTABS[key].mod!==id)throw new Error('addTab: id занят');

/* ---- Загрузка и установка ---- */
function runMod(rec){const id=rec.id;RT[id]=RT[id]||{status:'off',errors:0,counts:{},last:''};const r=RT[id];
  if(!rec.enabled){r.status='off';return}
  try{localStorage.setItem(BOOTKEY,id)}catch(e){}
  try{const api=makeApi(rec),cache={},mkReq=from=>function require(p){const base=from.indexOf('/')>=0?from.slice(0,from.lastIndexOf('/')):'',ps=String(p),full=normPath(ps[0]==='.'?(base?base+'/':'')+ps:ps);
      const hit=[full,full+'.js',full+'.json',full+'/index.js'].find(c=>rec.files&&rec.files[c]);if(!hit)throw new Error('require: модуль «'+p+'» не найден (из '+from+'). Модули есть только в ZIP-модах');
      if(cache[hit])return cache[hit].exports;const m={exports:{}};cache[hit]=m;const src=fileText(rec,hit);
      if(/\.json$/i.test(hit)){m.exports=JSON.parse(src);return m.exports}
      new Function('GoldRush','require','module','exports','"use strict";\n'+src+'\n//# sourceURL=goldrush-mod-'+id+'/'+hit)(api,mkReq(hit),m,m.exports);return m.exports},
      mm={exports:{}};
    new Function('GoldRush','require','module','exports','"use strict";\n'+rec.code+'\n//# sourceURL=goldrush-mod-'+id+'/'+(rec.main||'main.js'))(api,mkReq(rec.main||'main.js'),mm,mm.exports);r.status='ok'}
  catch(e){r.status='error';logErr(id,'load',e);r.last='load: '+((e&&e.message)||e)}
  try{localStorage.removeItem(BOOTKEY)}catch(e){}}
function parseMeta(code){const m={};code.split('\n').slice(0,40).forEach(ln=>{const x=/^\s*\/\/\s*@(\w+)\s+(.+?)\s*$/.exec(ln);if(x)m[x[1].toLowerCase()]=x[2]});return m}
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,32);
function makeRec(meta,code,fname,files,main){const name=String(meta.name||String(fname||'').replace(/\.(js|zip)$/i,'')||'Мод');let id=slug(meta.id||name);if(!id||!/^[a-z]/.test(id))id='mod_'+(id||hs(code).toString(36));
  const rec={id,name,version:String(meta.version||''),author:String(meta.author||''),description:String(meta.description||''),code,enabled:true,ts:Date.now()};if(files){rec.files=files;rec.main=main}return rec}
function finishInstall(rec){const oi=MODS.findIndex(x=>x.id===rec.id),prev=oi>=0?MODS[oi]:null;if(prev)MODS[oi]=rec;else MODS.push(rec);
  if(!saveMods()){if(prev)MODS[oi]=prev;else MODS.pop();throw new Error('Не хватило места в LocalStorage (лимит около 5 МБ). Удалите ненужные моды или уменьшите картинки')}
  if(prev)return{rec,reload:true};runMod(rec);rebuildTV();renderNav();emitTo(rec.id,'ready');return{rec,reload:false}}
function installMod(code,fname){code=String(code||'').replace(/^\uFEFF/,'').trim();if(!code)throw new Error('Пустой код');
  try{new Function('require','module','exports',code)}catch(e){throw new Error('Синтаксическая ошибка: '+e.message)}
  return finishInstall(makeRec(parseMeta(code),code,fname))}
async function installZip(buf,fname){const raw=await unzip(buf),names=Object.keys(raw);if(!names.length)throw new Error('Архив пуст');
  const t0=names[0].split('/')[0],top=names.every(n=>n.includes('/')&&n.split('/')[0]===t0)?t0+'/':'',files={},TEXT=/\.(js|json|txt|md|css|html|svg|csv)$/i;
  for(const n of names){const nn=top?n.slice(top.length):n,d=raw[n];if(TEXT.test(nn))files[nn]={t:'text',d:new TextDecoder().decode(d)};else{let s='';for(let i=0;i<d.length;i+=8192)s+=String.fromCharCode.apply(null,d.subarray(i,i+8192));files[nn]={t:'b64',d:btoa(s)}}}
  let man={};if(files['mod.json']){try{man=JSON.parse(files['mod.json'].d)}catch(e){throw new Error('mod.json: '+e.message)}}
  const js=Object.keys(files).filter(f=>/\.js$/i.test(f)),main=man.main?normPath(man.main):(files['main.js']?'main.js':files['index.js']?'index.js':(js.length===1?js[0]:null));
  if(!main||!files[main])throw new Error('В архиве не найден главный файл: нужен main.js или поле "main" в mod.json');
  try{new Function('require','module','exports',files[main].d)}catch(e){throw new Error(main+': синтаксическая ошибка: '+e.message)}
  return finishInstall(makeRec(Object.assign(parseMeta(files[main].d),man),files[main].d,fname,files,main))}
const isZipBuf=b=>{const u=new Uint8Array(b);return u.length>3&&u[0]===0x50&&u[1]===0x4b&&u[2]===3&&u[3]===4};
async function installBuf(buf,fname){if(isZipBuf(buf))return installZip(buf,fname);return installMod(new TextDecoder().decode(buf),fname)}
async function installUrl(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return installBuf(await r.arrayBuffer(),decodeURIComponent(u.split('?')[0].split('/').pop()||'mod'))}
function reloadGame(){save();setTimeout(()=>location.reload(),50)}

  <div class="btnrow mt"><button class="btn gold" data-a="mdocs">Копировать документацию</button><button class="btn" data-a="mdocsdl">Скачать .md</button><button class="btn" data-a="mtpl">Копировать шаблон</button></div>

function copyText(t){const ok=()=>toast('Скопировано');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t))}else fallbackCopy(t);
